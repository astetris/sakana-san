    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
      }
    }
  </script>

  <link rel="manifest" href="./manifest.webmanifest?v=20261128_025945" />
  <meta name="theme-color" content="#0b1324" />

</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <!-- ===== ホーム画面（ダッシュボード） ===== -->
  <div id="home-screen" class="screen active">
    <header class="home-header">
      <div>
        <h1 class="game-title" id="secret-admin-trigger">さかなサン</h1>
        <p class="subtitle" id="live-clock">読み込み中...</p>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-open-account-home" title="アカウント連携">🔐</button>
        <button class="btn-icon" id="btn-sound-home" title="音量切替">🔊</button>
        <div class="online-badge">
          <span class="dot"></span>
          <span><strong id="online-count">-</strong>人</span>
        </div>
      </div>
    </header>

    <section class="glass-card env-card">
      <div class="env-grid">
        <div><span class="label">天候 / 風</span><strong id="env-weather">-</strong></div>
        <div><span class="label">水温 / 潮回り</span><strong id="env-sea">-</strong></div>
        <div><span class="label">本日の市場相場</span><strong id="env-market">-</strong></div>
      </div>
    </section>

    <section class="glass-card">
      <div class="section-head">
        <h2>セーブスロット（最大5枠）</h2>
        <span class="sync-status" id="sync-status">接続中...</span>
      </div>
      <div id="slot-list" class="slot-list"></div>
    </section>

    <section class="glass-card">
      <div class="section-head">
        <h2>🏆 今日のランキング（5部門）</h2>
        <button class="btn-mini" id="btn-refresh-rank">更新</button>
      </div>
      <div id="home-rank-tabs" class="rank-tabs"></div>
      <ol id="ranking-list" class="ranking-list">
        <li class="muted">読み込み中...</li>
      </ol>
    </section>
  </div>

  <!-- ===== プレイ画面（シームレス・オープンワールド） ===== -->
  <div id="play-screen" class="screen">
    <div class="top-stack">
      <header class="hud-top">
        <div class="hud-left">
          <button class="btn-icon" id="btn-back-home">🏠</button>
          <div class="player-meta" id="btn-hud-profile" title="プロフィールを開く">
            <strong id="hud-name">漁師</strong>
            <span id="hud-money">¥0</span>
          </div>
        </div>
        <div class="hud-right">
          <button class="pearl-pill" id="btn-open-pearls" title="真珠ショップ">💎<span id="hud-pearls">0</span></button>
          <div class="stamina-pill">⚡<span id="hud-stamina">100</span></div>
          <div id="hud-fuel-pill" class="fuel-pill hidden">⛽<span id="hud-fuel">0</span>L</div>
          <button class="btn-icon" id="btn-sound-play" title="音量切替">🔊</button>
        </div>
      </header>

      <nav class="menu-bar">
        <button class="btn-mini" id="btn-open-cooler">🧊<span id="hud-cooler-count">0/10</span></button>
        <button class="btn-mini" id="btn-open-dock">🚤 船</button>
        <button class="btn-mini" id="btn-open-shop">🏪 道具</button>
        <button class="btn-mini" id="btn-open-lounge">🍜 憩い</button>
        <button class="btn-mini" id="btn-open-jobs">💼 バイト</button>
        <button class="btn-mini" id="btn-open-office">🏢 事務所<span id="office-dot" class="notif-dot hidden"></span></button>
          <button class="btn-mini" id="btn-open-stocks">📈 魚株</button>
      </nav>

      <!-- リアルタイム釣果速報＆チャット通知 -->
      <div id="live-ticker" class="live-ticker hidden">📣 港のライブ速報待機中...</div>

      <div class="world-row">
        <div class="area-stack">
          <div class="area-pill">
            <strong id="hud-area-name">📍 港・堤防（徒歩）</strong>
            <span id="hud-env-mini" class="muted">-</span>
          </div>
          <div id="buff-badge" class="buff-badge hidden">🍱 料理バフ発動中</div>
          <div id="together-badge" class="together-badge hidden">🤝 一緒に釣り中（査定+10%・レアUP）</div>
        </div>
        <div class="minimap-wrap">
          <canvas id="minimap-canvas" width="96" height="96"></canvas>
          <button id="btn-return-port" class="btn-tiny" title="港の桟橋へ戻る">⚓港へ</button>
        </div>
      </div>

      <div class="mode-switch">
        <button id="tab-mode-fish" class="mode-btn active">🎣 釣り</button>
        <button id="tab-mode-shell" class="mode-btn">🐚 貝・海藻</button>
        <button id="tab-mode-net" class="mode-btn">🕸️ 網漁</button>
      </div>
    </div>

    <!-- ソナー表示（乗船時） -->
    <div id="sonar-bar" class="sonar-bar hidden">
      <span id="sonar-text">📡 魚群ソナー: 探索中...</span>
      <button id="btn-autopilot" class="btn-sub">🧭 魚群へ自動航行</button>
    </div>

    <!-- ファイト中3本ゲージ -->
    <div id="fight-panel" class="fight-panel hidden">
      <div class="fight-info">
        <span id="fight-distance">距離: 25.0m</span>
        <span id="fight-fish-stamina">魚体力: 100%</span>
      </div>
      <div class="gauge-row"><span>竿</span><div class="bar"><div id="bar-rod" class="fill"></div></div></div>
      <div class="gauge-row"><span>糸</span><div class="bar"><div id="bar-line" class="fill"></div></div></div>
      <div class="gauge-row"><span>リール</span><div class="bar"><div id="bar-reel" class="fill"></div></div></div>
      <div class="drag-control">
        <label>ドラグ強さ: <strong id="drag-val">50%</strong> <span id="gear-power-hint" class="muted"></span></label>
        <input type="range" id="drag-slider" min="15" max="95" value="50" />
      </div>
    </div>

    <div id="status-banner" class="status-banner">左下のスティックで自由に歩こう！桟橋から船に乗れるよ</div>

    <!-- マルチスタンプ選択ポップ -->
    <div id="stamp-bar" class="stamp-bar hidden">
      <button class="stamp-btn" data-stamp="👋 よろしく！">👋 よろしく</button>
      <button class="stamp-btn" data-stamp="🎣 ナイス！">🎣 ナイス!</button>
      <button class="stamp-btn" data-stamp="🐟 ここ釣れる！">🐟 釣れる!</button>
      <button class="stamp-btn" data-stamp="🎉 大漁だー！">🎉 大漁!</button>
    </div>

    <!-- 下部操作ドック -->
    <div class="bottom-controls">
      <div id="joy-base" class="joy-base">
        <div id="joy-knob" class="joy-knob"></div>
      </div>
      <div class="right-actions">
        <div class="sub-action-row">
          <button id="btn-open-chat" class="btn-stamp" title="全体チャット＆フレンド">💬</button>
          <button id="btn-stamp-toggle" class="btn-stamp" title="ワンタップスタンプ">😊</button>
          <button id="btn-open-gacha" class="btn-stamp" title="ガチャ＆貝殻交換所">🎰</button>
          <button id="btn-open-orders-quick" class="btn-stamp" title="納品依頼">📋</button>
          <button id="btn-board-toggle" class="btn-board hidden">🚤 船に乗る</button>
        </div>
        <button id="btn-main-action" class="btn-action">🎣 キャスト（⚡2）</button>
      </div>
    </div>
  </div>

  <!-- ===== 汎用モーダル ===== -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title">タイトル</h3>
        <button class="btn-icon" id="btn-close-modal">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

      <script>
    /* module-error-screen-tracer */
    (function() {
      function showErr(txt) {
        try {
          var clk = document.getElementById("live-clock");
          var syn = document.getElementById("sync-status");
          var ban = document.getElementById("status-banner");
          if (clk) clk.textContent = txt;
          if (syn) syn.textContent = txt;
          if (ban) ban.textContent = txt;
        } catch (e) {}
      }
      window.addEventListener("error", function(ev) {
        var msg = (ev && ev.message) ? ev.message : "Script Error";
        var src = (ev && ev.filename) ? (" @ " + ev.filename.split("/").pop() + ":" + ev.lineno) : "";
        showErr("⚠️ " + msg + src);
      });
      window.addEventListener("unhandledrejection", function(ev) {
        var r = ev && ev.reason;
        var msg = (r && r.message) ? r.message : String(r || "Promise Error");
        showErr("⚠️ " + msg);
      });
      showErr("⏳ モジュール読込中...");
    })();
  </script>
<script>
    (function() {
      /* sakana-auto-cache-bust */
      const ver = "20261128_115954";
      const css = document.getElementById("main-css");
      if (css) css.href = "./css/style.css?v=" + ver;
      const s = document.createElement("script");
      s.type = "module";
      s.src = "./js/main.js?v=" + ver;
      document.body.appendChild(s);
    })();
  </script>
<script>
/* fast-boot-err-tracer */
(function(){
  function putMsg(t){
    try {
      var c = document.getElementById('live-clock');
      var s = document.getElementById('sync-status');
      var b = document.getElementById('status-banner');
      if (c) c.textContent = t;
      if (s) s.textContent = t;
      if (b) b.textContent = t;
    } catch(_){}
  }
  window.__putBootMsg = putMsg;
  window.addEventListener('error', function(e){
    var f = (e && e.filename) ? e.filename.split('/').pop() + ':' + e.lineno : '';
    putMsg('⚠️ ERR: ' + ((e && e.message) || 'Error') + (f ? ' (' + f + ')' : ''));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason;
    putMsg('⚠️ REJECT: ' + ((r && r.message) || String(r || 'Promise')));
  });
  // cleaned up boot debug message
})();
</script>
  <!-- pwa-sw-start -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
      });
    }
  </script>
  <!-- pwa-sw-end -->
</body>
